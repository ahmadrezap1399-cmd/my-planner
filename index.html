  const cur={n:MN,g:g,d:done,x:dd()},rows=S.h.filter(h=>h.n!==cur.n).concat(cur),hm=Math.max(1,...rows.map(r=>Math.max(r.g,r.d)));
  $('#hist').innerHTML='<p class="pace" style="text-align:start">'+(tn?'میانگین زمان هر ویدیو: '+fa(Math.round(ts/tn/60))+' دقیقه (از '+fa(tn)+' ویدیوی زمان‌سنجی‌شده)':'با زدن «در حال انجام» یا ⏱ زمان‌سنج شروع می‌شه و اینجا میانگین زمان هر ویدیو رو می‌بینی.')+'<br>انجام‌شده‌ها: '+fa(wc[0])+' آسان | '+fa(wc[1])+' متوسط | '+fa(wc[2])+' سنگین</p>'+rows.map(r=>'<div class="row"><span>'+esc(r.n)+'</span><div class="bar"><i style="width:'+r.d/hm*100+'%"></i></div><small>'+fa(r.d)+' از '+fa(r.g)+'</small></div>').join('')+'<div class="flex"><button class="btn" data-savehist="1">ثبت نتیجه‌ی این ماه در تاریخچه</button></div>';
}
let TODAY=0,PT=null;
try{const p=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());const g=t=>+p.find(x=>x.type===t).value;PT={y:g('year'),m:g('month'),d:g('day')}}catch(e){}
let tab=TODAY?W.findIndex(w=>TODAY>=w[0]&&TODAY<=w[1]):0,last=null,pk=null,first=true;
const wd=d=>(d-1+F)%7;
const sl=d=>S.d[d]||Array.from({length:T[d-1]},()=>({s:0,c:''}));
const mut=d=>S.d[d]||(S.d[d]=sl(d));

let ref=null,tm;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(()=>{if(ref)ref.set(S).catch(()=>{})},600)}
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use('db');if(!db)return;
  ref=db.doc('planner/state');
  ref.onSnapshot(snap=>{
    if(snap.hasPendingWrites)return;
    const d=typeof snap.data==='function'?snap.data():snap.data;
    const ex=typeof snap.exists==='function'?snap.exists():snap.exists;
    if(ex!==false&&d&&d.d){if(JSON.stringify(d)===JSON.stringify(S))return;S=d;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}
    else ref.set(S).catch(()=>{});
  },()=>{});
}catch(e){}})();

function num(el,v){
  const f=+el.dataset.v||0;el.dataset.v=v;
  if(rm||f===v){el.textContent=fa(v);return}
  const t0=performance.now();
  (function s(t){const p=Math.min(1,(t-t0)/650),e=1-Math.pow(1-p,3);el.textContent=fa(Math.round(f+(v-f)*e));if(p<1)requestAnimationFrame(s)})(t0);
}
function burst(){
  if(rm)return;
  const cols=['#0FAE97','#F5A524','#5B45F0','#FF5C7A'];
  for(let i=0;i<30;i++){
    const e=document.createElement('i');e.className='cf';e.style.background=cols[i%4];document.body.append(e);
    const a=Math.random()*Math.PI*2,v=90+Math.random()*150;
    e.animate([{transform:'translate(-50%,0) rotate(0)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*v+'px),'+(Math.sin(a)*v+90)+'px) rotate('+Math.random()*600+'deg)',opacity:0}],{duration:1100+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove();
  }
}

function render(){
  S.h=S.h||[{n:'ماه قبل',g:60,d:60}];S.n=S.n||{};S.o=S.o||{snd:1,vib:1};S.pr=S.pr||{p:450000,a:600000};applyCfg();
  const g=S.goal>0?+S.goal:80,pv=S.prev>=0?+S.prev:60;
  let done=0,prog=0,plan=0;const wk=W.map(()=>[0,0]);
  for(let d=1;d<=ML;d++){
    const a=sl(d),w=W.findIndex(x=>d>=x[0]&&d<=x[1]);
    for(const x of a){if(x.s==2){done++;wk[w][0]++}else if(x.s==1)prog++}
    wk[w][1]+=T[d-1];if(TODAY&&d<=TODAY)plan+=T[d-1];
  }
  $('#arc').style.strokeDashoffset=C*(1-Math.min(1,done/g));
  const ang=2*Math.PI*Math.min(pv/g,1),ms=$('#ms');
  ms.setAttribute('cx',60+54*Math.cos(ang));ms.setAttribute('cy',60+54*Math.sin(ang));
  ms.style.display=pv>0&&pv<g?'':'none';
  num($('#pct'),Math.round(done/g*100));num($('#nDone'),done);num($('#nProg'),prog);num($('#nLeft'),Math.max(g-done,0));
  let m;
  if(done>=g)m='هدف ماه کامل شد. عالی بود!';
  else if(done>pv)m=fa(done-pv)+' ویدیو بالاتر از رکورد ماه قبل';
  else if(done===pv&&pv>0)m='به رکورد ماه قبل رسیدی؛ هر ویدیوی بعدی رکورد جدیده';
  else if(done===0)m='اولین ویدیو رو تیک بزن تا ماه شروع بشه';
  else m=fa(pv-done)+' ویدیو تا رکورد ماه قبل مونده';
  $('#msg').textContent=m;
  $('#pace').textContent=TODAY?'طبق برنامه تا پایان امروز: '+fa(plan)+' ویدیو  |  انجام‌شده: '+fa(done):'';
  const gi=$('#goal'),pi=$('#prev');
  if(document.activeElement!==gi)gi.value=g;if(document.activeElement!==pi)pi.value=pv;
  $('#today').textContent=TODAY?'امروز '+fa(TODAY)+' '+MS:'ماه '+MS;
  if(last!==null){if(last<=pv&&done>pv&&pv>0)burst();else if(last<g&&done>=g)burst()}
  last=done;

  $('#tl').innerHTML=Array.from({length:ML},(_,i)=>{
    const d=i+1,a=sl(d);
    return '<button class="col'+(d===TODAY?' now':'')+'" data-go="'+d+'" aria-label="'+WD[wd(d)]+' '+fa(d)+' '+MS+'"><span class="stack">'+(a.length?a.map(x=>'<i class="s'+x.s+'"></i>').join(''):'<i class="e"></i>')+'</span><b>'+fa(d)+'</b></button>';
  }).join('');
  $('#tabs').innerHTML=W.map((w,i)=>'<button class="tab'+(i===tab?' on':'')+'" data-tab="'+i+'">هفته '+fa(i+1)+'<small>'+fa(w[0])+' تا '+fa(w[1])+' | '+fa(wk[i][0])+' از '+fa(wk[i][1])+'</small></button>').join('');

  let h='';const names=new Set();
  for(let d=W[tab][0];d<=W[tab][1];d++){
    const a=sl(d),n=a.filter(x=>x.s==2).length,fr=wd(d)===6,tu=wd(d)===3;
    a.forEach(x=>x.c&&names.add(x.c));
    h+='<article class="day'+(d===TODAY?' today':'')+'" id="day'+d+'"><div class="dh"><h3>'+WD[wd(d)]+' '+fa(d)+' '+MS+(tu?'<span class="tag t">روز آموزش</span>':'')+(fr?'<span class="tag">تعطیل | جبرانی</span>':'')+(d===TODAY?'<span class="tag n">امروز</span>':'')+'</h3><div class="cnt"><b>'+fa(n)+'</b> از '+fa(a.length)+'</div></div>'
    +'<div class="bar"><i style="width:'+(a.length?n/a.length*100:0)+'%"></i></div><ul>'
    +a.map((x,i)=>'<li'+dcl(x)+'><button class="st s'+x.s+'" data-d="'+d+'" data-i="'+i+'" aria-label="تغییر وضعیت ویدیو '+fa(i+1)+'">'+(x.s==2?'✓':'')+'</button><input class="nm" data-d="'+d+'" data-i="'+i+'" value="'+esc(x.c)+'" placeholder="نام مشتری" list="dl"><button class="tm'+(x.r?' on':'')+'" data-tm="'+d+'" data-i="'+i+'" aria-label="زمان‌سنج">'+fmt(x)+'</button><button class="rm" data-op="'+d+'-'+i+'" aria-label="جزئیات">⋯</button>'+(i>=T[d-1]?'<button class="rm" data-rm="'+d+'" data-i="'+i+'" aria-label="حذف">×</button>':'')+(OP.has(d+'-'+i)?'<div class="opt"><select data-wd="'+d+'" data-i="'+i+'" aria-label="سنگینی">'+['آسان','متوسط','سنگین'].map((n,k)=>'<option value="'+k+'"'+((x.w||0)===k?' selected':'')+'>'+n+'</option>').join('')+'</select><select data-kd="'+d+'" data-i="'+i+'" aria-label="نرم‌افزار"><option value="0"'+(x.k?'':' selected')+'>پریمیر</option><option value="1"'+(x.k?' selected':'')+'>افتر افکت</option></select><input type="number" min="1" inputmode="numeric" data-dd="'+d+'" data-i="'+i+'" value="'+esc(x.m||'')+'" placeholder="مهلت: روز ماه"></div>':'')+'</li>').join('')
    +'</ul><button class="add" data-add="'+d+'">+ ویدیوی اضافه</button></article>';
  }
  $('#days').innerHTML=h;
  $('#dl').innerHTML=[...names].map(n=>'<option value="'+esc(n)+'">').join('');
  extras(done,prog,g);extras2(done,prog,g);extras3(done,prog,g);extras4(done,prog,g);renderBd();applyTheme();
  if(pk){const el=document.querySelector('.st[data-d="'+pk[0]+'"][data-i="'+pk[1]+'"]');if(el)el.classList.add('pop');pk=null}
  if(first){first=false;const c=$('.col.now');if(c)c.scrollIntoView({inline:'center',block:'nearest'})}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tm){const x=mut(+t.dataset.tm)[+t.dataset.i];if(x.r){x.t=(x.t||0)+Math.floor((Date.now()-x.r)/1000);x.r=0}else x.r=Date.now();save();render();return}
  if(t.dataset.op){const k=t.dataset.op;OP.has(k)?OP.delete(k):OP.add(k);render();return}
  if(t.dataset.th!==undefined){S.th=t.dataset.th;save();render();return}
  if(t.dataset.bsum){const c=S.cl[BC],n=c.tgt?Math.round(c.done/c.tgt*100):0,rows=[['مشتری',BC],['پیشرفت',fa(c.done)+' از '+fa(c.tgt)+' پست ('+fa(n)+'٪)']];TS5.forEach((s,k)=>rows.push([s,fa(c.tp.filter(x=>(x.st||0)===k).length)+' موضوع']));if(TODAY)rows.push(['آخرین به‌روزرسانی',fa(TODAY)+' '+MS]);BSI=bimg('وضعیت پروژه | '+BC,rows);renderBd();return}
  if(t.dataset.bpi){const c=S.cl[BC],p=pr({k:((S.cu||{})[BC]||{}).k||0}),mc=Math.max(c.mil||0,c.tp.filter(x=>(x.vw||0)>=1e6).length),a=c.done*p,b=(c.fol||0)>=S.bn.ft?S.bn.fa:0,m=mc*S.bn.ma;BSI=bimg('صورت‌حساب پروژه | '+BC,[['پست‌های تحویل‌شده ('+fa(c.done)+' × '+fa(p)+')',fa(a)],['پاداش فالوور',fa(b)],['پاداش پست میلیونی ('+fa(mc)+')',fa(m)]],['جمع (تومان)',fa(a+b+m)]);renderBd();return}
  if(t.dataset.bun){cp(unText(S.cl[BC]),'لیست برش‌نخورده‌ها کپی شد.');return}
  if(t.dataset.bd){BO=1;BC='';renderBd();return}
  if(t.dataset.bdx){BO=0;renderBd();return}
  if(t.dataset.bopen){BC=decodeURIComponent(t.dataset.bopen);renderBd();return}
  if(t.dataset.bback){BC='';renderBd();return}
  if(t.dataset.bnew){const n=$('#bdn').value.trim();if(n&&!S.cl[n]){S.cl[n]={tgt:15,done:0,pri:0,due:'',fol:0,mil:0,raws:[],tp:[]};S.cu=S.cu||{};S.cu[n]=S.cu[n]||{k:0,d:0};save();BC=n;renderBd();render()}return}
  if(t.dataset.bdel){if(!BD){BD=1;t.textContent='مطمئنی؟ دوباره بزن';return}BD=0;delete S.cl[BC];BC='';save();renderBd();return}
  if(t.dataset.bpp){const c=S.cl[BC];c.done=Math.max(0,c.done+(+t.dataset.bpp));save();renderBd();return}
  if(t.dataset.bdeliver){const c=S.cl[BC];c.done++;mut(TODAY||1).push({s:2,c:BC,k:((S.cu||{})[BC]||{}).k||0});save();render();renderBd();toast('پست تحویل ثبت شد');return}
  if(t.dataset.braw){S.cl[BC].raws.push({n:'',min:0,sync:0,st:0,posts:0});save();renderBd();return}
  if(t.dataset.brawx){const c=S.cl[BC],i=+t.dataset.brawx;c.raws.splice(i,1);c.tp.forEach(x=>{if(x.r==i+1)x.r=0;else if(x.r>i+1)x.r--});save();renderBd();return}
  if(t.dataset.btx){S.cl[BC].tp.splice(+t.dataset.btx,1);save();renderBd();return}
  if(t.dataset.btadd){const c=S.cl[BC];$('#btx').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>{const m=s.match(/^([0-9۰-۹]{1,3}:[0-9۰-۹]{2})\s*[-–]?\s*(.+)$/);c.tp.push({t:m?m[2]:s,tc:m?m[1]:'',r:0,st:0})});save();renderBd();return}
  if(t.dataset.rebal){redis();save();render();toast('تارگت روزهای باقی‌مانده دوباره چیده شد');return}
  if(t.dataset.fm){FM=1;fmRender();return}
  if(t.dataset.fmx){FM=0;fmRender();return}
  if(t.dataset.fmdone){const k=t.dataset.fmdone.split('-'),x=mut(+k[0])[+k[1]];x.s=2;stopT(x);fb(2);save();render();return}
  if(t.dataset.fmstart){let h=null;[TODAY,...Array.from({length:ML},(_,i)=>i+1)].forEach(d=>{if(!h&&d>0)sl(d).forEach((x,i)=>{if(!h&&x.s==0)h=[d,i]})});if(h){const x=mut(h[0])[h[1]];x.s=1;x.r=Date.now();save();render()}return}
  if(t.dataset.bnx){BN=0;render();return}
  if(t.dataset.cuadd){const n=decodeURIComponent(t.dataset.cuadd),u=S.cu[n]||{},day=TODAY||1,o={s:0,c:n,k:u.k||0};if(u.d)o.m=Math.min(ML,day+(+u.d));mut(day).push(o);save();render();toast('ویدیوی '+n+' به '+fa(day)+' '+MS+' اضافه شد');return}
  if(t.dataset.cunew){const n=$('#cun').value.trim();if(n){S.cu[n]=S.cu[n]||{k:0,d:0};save();render()}return}
  if(t.dataset.ivgo){const n=$('#ivs').value;if(n){invoice(n);render()}return}
  if(t.dataset.ivcopy){navigator.clipboard.writeText(IVX).then(()=>toast('متن فاکتور کپی شد'),()=>toast('کپی نشد'));return}
  if(t.dataset.tp!==undefined){S.tp=t.dataset.tp;S.cc={};S.lay='';save();render();return}
  if(t.dataset.ccr){S.cc={};save();render();return}
  if(t.dataset.copyrep){cp(monthReport(),'گزارش ماه کپی شد.');return}
  if(t.dataset.newm){
    if(!NM){NM=1;t.textContent='مطمئنی؟ ماه فعلی ذخیره و پاک می‌شه. دوباره بزن';return}
    NM=0;t.textContent='شروع ماه جدید';
    const v=$('#nm').value.split('-').map(Number),gl=Math.max(1,+$('#ng').value||S.goal),c=newCfg(v[0],v[1]);
    if(!c){msg('تقویم اون ماه پیدا نشد.');return}
    const o={n:MN,g:S.goal,d:last,x:dd()},i=S.h.findIndex(h=>h.n===o.n);if(i<0)S.h.push(o);else S.h[i]=o;
    c.T=genT(c.len,c.F,gl);S.m=c;S.goal=gl;S.prev=Math.max(...S.h.map(h=>h.d));S.d={};S.n={};OP.clear();tab=0;last=null;save();render();msg('ماه جدید ساخته شد و ماه قبل توی تاریخچه ثبت شد.');return}
  if(t.dataset.copywk){cp(wkText(),'خلاصه‌ی هفته کپی شد.');return}
  if(t.dataset.savehist){const o={n:MN,g:S.goal,d:last,x:dd()},i=S.h.findIndex(h=>h.n===o.n);if(i<0)S.h.push(o);else S.h[i]=o;save();render();return}
  if(t.dataset.bk==='exp'){S.lb=Date.now();const s=JSON.stringify(S);$('#bk').value=s;cp(s,'بک‌آپ ساخته و کپی شد. این متن رو جایی نگه دار.');return}
  if(t.dataset.bk==='imp'){try{const o=JSON.parse($('#bk').value);if(!o||!o.d)throw 0;S=o;save();render();msg('بازیابی شد.')}catch(e){msg('متن بک‌آپ معتبر نیست.')}return}
  if(t.dataset.tab!==undefined){tab=+t.dataset.tab;render();return}
  if(t.dataset.go){const d=+t.dataset.go;tab=W.findIndex(w=>d>=w[0]&&d<=w[1]);render();const el=$('#day'+d);if(el){el.scrollIntoView({behavior:rm?'auto':'smooth',block:'center'});el.classList.add('flash')}return}
  if(t.classList.contains('st')){const d=+t.dataset.d,i=+t.dataset.i,x=mut(d)[i];x.s=(x.s+1)%3;if(x.s==1&&!x.r)x.r=Date.now();if(x.s!=1&&x.r){x.t=(x.t||0)+Math.floor((Date.now()-x.r)/1000);x.r=0}fb(x.s);pk=[d,i];save();render();return}
  if(t.dataset.add){mut(+t.dataset.add).push({s:0,c:''});save();render();return}
  if(t.dataset.rm){mut(+t.dataset.rm).splice(+t.dataset.i,1);save();render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('nm')){mut(+t.dataset.d)[+t.dataset.i].c=t.value;save()}else if(t.dataset.dd){mut(+t.dataset.dd)[+t.dataset.i].m=t.value;save()}else if(t.dataset.bp){bset(t)}else if(t.id==='bsq'){bsearch(t.value)}else if(t.dataset.cc){S.cc=S.cc||{};S.cc[t.dataset.cc]=t.value;save();applyTheme()}else if(t.id==='note'){S.n[tab]=t.value;save()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='goal'){S.goal=Math.max(1,+t.value||80);if(S.m)S.m.T=genT(S.m.len,S.m.F,S.goal);save();render()}
  else if(t.id==='prev'){S.prev=Math.max(0,+t.value||0);save();render()}
  else if(t.classList.contains('nm'))render();
  else if(t.dataset.bp){bset(t);if(t.tagName==='SELECT'||t.type==='checkbox')renderBd()}
  else if(t.dataset.bn){S.bn[t.dataset.bn]=+t.value||0;save()}
  else if(t.dataset.cap){S.cap=+t.value||40;save()}
  else if(t.dataset.cuk){const n=decodeURIComponent(t.dataset.cuk);(S.cu[n]=S.cu[n]||{}).k=+t.value;save()}
  else if(t.dataset.cud){const n=decodeURIComponent(t.dataset.cud);(S.cu[n]=S.cu[n]||{}).d=+t.value||0;save()}
  else if(t.id==='lay'){S.lay=t.value;save();render()}
  else if(t.dataset.kd){mut(+t.dataset.kd)[+t.dataset.i].k=+t.value;save();render()}
  else if(t.id==='pp'||t.id==='pa'){S.pr[t.id==='pp'?'p':'a']=Math.max(0,+t.value||0);save();render()}
  else if(t.dataset.wd){mut(+t.dataset.wd)[+t.dataset.i].w=+t.value;save();render()}
  else if(t.id==='snd'||t.id==='vib'){S.o[t.id]=t.checked?1:0;save()}
});
render();
